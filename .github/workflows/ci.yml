name: CI

# push・pull_request毎にlint/test/buildを自動実行する。デプロイ(Vercel)やDB(Supabase)には
# 一切触れない、コード品質チェックのみの独立したジョブ(既存の.github/workflows/db-backup.yml
# とは無関係)。GitHub側でBranch Protectionを設定する際、このジョブ(verify)を
# 「必須ステータスチェック」として指定できる。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # scripts/deploy/verify.sh を再利用する(npm run deploy:production が使うチェックと
      # 完全に同じ内容・同じ基準にするため)。lintは既存の8件(このリポジトリに元々あった、
      # 今回のタスクとは無関係なエラー)を許容し、新規エラーの増加だけを検出する仕組み。
      - run: bash scripts/deploy/verify.sh
