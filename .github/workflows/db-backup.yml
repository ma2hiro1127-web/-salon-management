name: Database Backup

# 毎日04:00 JST(=19:00 UTC 前日)、利用の少ない深夜帯に自動実行する(要件4)。
# workflow_dispatchで手動実行もできるようにしておく(動作確認・緊急バックアップ用)。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

# このワークフローは既存アプリ(Vercelデプロイ・Supabase本体)から完全に独立しており、
# 失敗してもサロンマネージャー本体の動作には一切影響しない(スケジュール実行の別ジョブとして
# 動くだけで、デプロイパイプラインの一部ではない)。
jobs:
  backup:
    runs-on: ubuntu-latest
    # データ取得(pg_dump相当)のみで、リポジトリへの書き込みはbackupリポジトリ側のみ。
    permissions:
      contents: read
    steps:
      - name: Checkout (for backup scripts)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/backup
          sparse-checkout-cone-mode: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # 2026-09-05の障害調査で確認済みの動作バージョンに固定する(要件: CLIバージョンの
          # 確認)。"latest"のままだと将来CLI側のフラグ仕様が変わった場合に、スケジュール
          # 実行(誰も見ていない深夜帯)で気づかないまま突然壊れるリスクがあるため、意図的に
          # 固定し、更新する場合はこの値を明示的に上げる運用にする。
          version: "2.111.0"

      # 2026-09-05の障害調査で追加(要件: 接続情報・Project Ref等の確認をしやすくする)。
      # SUPABASE_DB_URLのホスト名・ポート・ユーザー名・DB名だけを表示し、パスワードは
      # 絶対に出力しない(GitHub Actions自体もsecretsの値をログへマスクするが、それに
      # 依存せずスクリプト側でも最初からパスワード部分を読み取って出力しない設計にする)。
      # 「password authentication failed」のような認証エラー時に、接続先(pooler
      # ホスト名・project ref相当のユーザー名)が意図した通りかをログだけで確認できるように
      # するための診断目的の1ステップで、これ自体は失敗しても後続を止めない。
      - name: Show connection info (safe, no password)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 -c "
          import os, urllib.parse as up
          url = os.environ.get('SUPABASE_DB_URL', '')
          if not url:
              print('::error::SUPABASE_DB_URL secret is empty or not set')
              raise SystemExit(1)
          parsed = up.urlparse(url)
          print(f'[connection-info] scheme={parsed.scheme}')
          print(f'[connection-info] host={parsed.hostname}')
          print(f'[connection-info] port={parsed.port}')
          print(f'[connection-info] user={parsed.username}')
          print(f'[connection-info] dbname={parsed.path.lstrip(\"/\")}')
          print('[connection-info] password=<redacted, length=' + str(len(parsed.password or '')) + '>')
          "
        continue-on-error: true

      - name: Run backup (dump + verify)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          chmod +x scripts/backup/*.sh
          ./scripts/backup/run_backup.sh "$RUNNER_TEMP/dump"

      - name: Checkout private backup repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Store new generation + prune old ones
        run: |
          chmod +x scripts/backup/store_and_prune.sh
          ./scripts/backup/store_and_prune.sh "$RUNNER_TEMP/dump" backup-repo

      - name: Commit and push
        working-directory: backup-repo
        run: |
          set -euo pipefail
          git config user.name "salon-manager-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (unexpected — a new daily generation should always differ)."
          else
            git commit -m "backup: $(date -u +%Y-%m-%d) $(date -u +%H:%M) UTC"
            git push
          fi
